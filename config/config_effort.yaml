# Paths configuration
paths:
  basedir: "data/effort"  # Base directory for raw data
  workdir: "workdir"        # Directory for intermediate files
  outputdir: "output"       # Directory for final outputs
  file_templates: 
    meg: "*/{subject}_*_*_{session}.meg4"
  iterable_fields: ["subject", "session"]  # Fields in the template to iterate over (e.g. subject, session)
  iterable_values:
    subject: ["0001", "0002"]  # List of subjects to process
    session: ["01", "02"]  # List of sessions to process

# Workflow configuration
workflow:
  plugin: Linear             # Plugin for parallel processing: Linear or MultiProc
  n_workers: 8              # Number of workers for parallel processing
  auto_workers: True        # Automatically set workers to max CPU cores - 2

# Processing configuration
pipeline_config:
  initial_preproc:
    steps:
      crop: true       # TODO: !NOT IMPLEMENTED!
      filter: true     # TODO: !NOT IMPLEMENTED!
      gradcomp: true   # TODO: !NOT IMPLEMENTED!
      ica: true        # TODO: !NOT IMPLEMENTED!

    args:
      crop:
        stim_channel:            # Channel to use for stimulus-based cropping
        min_buffer: -0.2         # Minimum time buffer (seconds) before stimulus onset
        max_buffer: 0.5          # Maximum time buffer (seconds) after stimulus offset
      filter:
        l_freq: 1.0              # Low-frequency cutoff (Hz)
        h_freq: 100             # High-frequency cutoff (Hz)
      gradcomp:
        gradcomp_auto: true               # Automatically apply gradient compensation (useful for CTF systems)
        order:                # Order of gradient compensation

  artifact_rejection:
    steps:
      zapline: true     # Enable/disable Zapline for line noise removal

    args:
      zapline:          # Denoising Source Separation (DSS) parameters
        fline: 60.0              # Line frequency (Hz)
        n_chunks: 10              # Number of chunks to split data for Zapline
        spot_sz: 7             # Size of the "spot" for Zapline (number of neighboring frequencies to consider)
        win_sz: 12             # Window size for Zapline (number of samples)
        nfft: 2048              # Number of FFT points for Zapline
        n_iter_max: 100             # Maximum number of iterations for Zapline
        mag_only: true             # Process only magnetometer channels with Zapline
        detect_line_freq: True    # Automatically detect line frequency from data (overrides fline if True)

  auto_ica:
    steps:
      compute_ica: True  # Enable/disable computation of ICA decomposition solution
      ic_labels: True    # Enable/disable labeling of ICA components using ICLabel

    args:
      compute_ica:
        ica_random_state: 821        # Random seed for reproducibility
        ica_n_components: 20         # Number of ICA components
        ica_l_freq: 1.0              # Low-frequency cutoff for ICA (Hz)
        ica_h_freq: 30.0             # High-frequency cutoff for ICA (Hz)
        method: fastica          # ICA method: fastica, infomax, etc.
        precomputed_ica_file:  # Optional path to pre-computed ICA solution (FIF file). If not provided, ICA will be computed from the raw data.

      ic_labels: # Should only be used with EEG data
        ica_exclude: []
        ic_labels_exclude: ["eye blink", "muscle artifact", "heart beat"]  # ICLabel class labels to exclude
        ic_label_threshold: 0.7  # Probability threshold for excluding components based on ICLabel classification
  
  epoching:
    steps:
      epoch: true       # TODO: !NOT IMPLEMENTED!

    args:
      epoch:
        
      autoreject: