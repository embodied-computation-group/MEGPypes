[project]
name = "megpypes"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "auto-mix-prep>=0.2.0",
    "ipykernel>=7.2.0",
    "marimo>=0.20.2",
    "meegkit>=0.1.9",
    "mne>=1.10.2",
    "nipype>=1.10.0",
    "pybids>=0.21.0",
    "pyyaml>=6.0.3",
    "pyzmq>=27.1.0",
]

[tool.pyright]
venvPath = "."
venv = ".venv"

[tool.uv]
package = true

[tool.setuptools.packages.find]
where = ["src"]
